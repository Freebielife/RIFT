name: Update TON observatory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - 'project.json'
      - 'common-services.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: observatory-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - name: Validate engine
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
          node --check web/app.js
          node --test tests/*.test.cjs
      - name: Collect on-chain data
        id: collect
        continue-on-error: true
        run: python3 -m scripts.refresh_observatory
      - name: Build and publish verified snapshot
        run: |
          if python3 build.py && python3 verify.py; then
            python3 scripts/publish_snapshot.py
          else
            echo "::warning::HTML build failed; publishing validated market snapshot independently"
            python3 -c 'import json; from pathlib import Path; from scripts.project_runtime import read_project, check_identity; root=Path("."); check_identity(json.loads((root/"data/snapshot.json").read_text()), read_project(root))'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- data/snapshot.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh market snapshot independently of HTML"
              git push origin HEAD:refs/heads/main
            fi
            exit 1
          fi
      - name: Report partial collection
        if: steps.collect.outcome == 'failure'
        run: exit 1
